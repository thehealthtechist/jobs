name: Daily Healthtech Job Scraper

on:
  schedule:
    # Runs automatically every day at 06:00 UTC (~11:30 AM IST)
    - cron: '0 6 * * *'
  # Allows you to manually click a button to run the scraper anytime
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push Updated Jobs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update job listings" && git push)
